<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afro Glow | Accessorise Your Glow</title>
<link id="fav" rel="icon" href="">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pu:#6b21a8;--bl:#dc2626;--pk:#b91c1c;--yl:#ef2b3d;--dk:#0a0a0a;--bg:#f4f3f5;--mut:#7a6f94;--ln:#e4e0e8;--ok:#13a06f;--bad:#e11d48}
*{box-sizing:border-box;margin:0}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--dk);line-height:1.5}
h1,h2,.logo{font-family:'Playfair Display',Georgia,serif}a{color:inherit;text-decoration:none}
header{background:#000;position:sticky;top:0;z-index:10;border-bottom:4px solid var(--yl)}
.bar{max-width:1200px;margin:auto;padding:8px 20px;display:flex;align-items:center}
.logo{font-size:26px;font-weight:800;color:#fff}.logo i{color:var(--yl);font-style:normal}
nav{display:flex;gap:4px;align-items:center;flex:1;flex-wrap:wrap}
nav a,nav button{padding:7px 13px;border-radius:99px;font-weight:500;font-size:14px;background:none;border:0;cursor:pointer;color:#fff;font-family:inherit}
nav a:hover,nav a.on{background:#ffffff26}nav .reg{background:var(--yl);color:#fff}
nav a.brand{display:flex;align-items:center;gap:10px;margin-right:auto;padding:0;border-radius:0;background:none!important;font-size:26px}
nav a.brand:hover{background:none}
.brand img{width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid var(--yl);object-fit:cover;flex:none}
.brand span{line-height:1.05}
.brand small{display:block;font-family:'Poppins',sans-serif;font-size:11px;font-weight:500;color:var(--yl);letter-spacing:.6px;margin-top:2px}
@media(max-width:560px){.brand img{width:44px;height:44px}nav a.brand{font-size:21px}}
.hero-logo{width:120px;height:120px;border-radius:50%;background:#fff;border:5px solid var(--yl);position:relative;margin-bottom:16px;box-shadow:0 8px 24px #0004;display:block}
.flogo{width:70px;height:70px;border-radius:50%;background:#fff;border:3px solid var(--yl);margin-bottom:8px}
.cnt{background:var(--pk);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:4px}
main{max-width:1200px;margin:auto;padding:22px 20px 60px;min-height:70vh}
.btn{display:inline-block;background:linear-gradient(90deg,#000,#1d1d24);color:#fff!important;border:0;padding:10px 22px;border-radius:99px;font-weight:600;cursor:pointer;font-size:15px;font-family:inherit}
.btn:hover{filter:brightness(1.08)}.btn.sm{padding:5px 13px;font-size:13px}.btn.y{background:var(--yl);color:#fff!important}.btn.pk{background:var(--pk)}.btn.out{background:#fff;color:#0a0a0a!important;border:2px solid #0a0a0a}
.hero{background:linear-gradient(135deg,#000 0%,#0d0d0d 60%,#2a0a45 100%);color:#fff;border-radius:28px;padding:62px 40px;position:relative;overflow:hidden}
.hero:before,.hero:after{content:'';position:absolute;border-radius:50%}.hero:before{width:300px;height:300px;right:-70px;top:-90px;background:var(--bl);opacity:.55}.hero:after{width:190px;height:190px;right:150px;bottom:-80px;background:var(--pu);opacity:.45}
.hero h1{font-size:clamp(32px,6vw,56px);line-height:1.1;max-width:600px;position:relative}.hero p{margin:14px 0 24px;max-width:460px;font-size:17px;position:relative}.hero .btn{position:relative}
.sec{margin-top:42px}.sec h2,h2.t{font-size:30px}.sub{color:var(--mut);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.grid.sm{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:15px}
.pc{transition:.2s}.pc:hover{transform:translateY(-4px);box-shadow:0 12px 28px #00000033}
.pc .em{font-size:52px;text-align:center;padding:16px;border-radius:14px}
.t0 .em{background:#e9e8ec}.t1 .em{background:#ffe3e8}.t2 .em{background:#e6dff0}.t3 .em{background:#ffd9de}
.pc h3{font-size:15px;font-weight:600;margin-top:8px}.cat{font-size:12px;color:var(--mut)}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.price{font-weight:700;color:var(--bl);font-size:17px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.cat-t{cursor:pointer;text-align:center;padding:24px 8px;font-weight:600}.cat-t span{display:block;font-size:36px}.cat-t:nth-child(4n+1){background:#e9e8ec}.cat-t:nth-child(4n+2){background:#ffe3e8}.cat-t:nth-child(4n+3){background:#e6dff0}.cat-t:nth-child(4n){background:#ffd9de}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.chip{padding:6px 16px;border-radius:99px;background:#fff;border:1px solid var(--ln);cursor:pointer;font-size:14px}.chip.on{background:#0a0a0a;color:#fff;border-color:#0a0a0a}
input,select,textarea{font:inherit;padding:10px 13px;border:1.5px solid var(--ln);border-radius:12px;background:#fff;width:100%;color:var(--dk)}
input:focus,select:focus{outline:0;border-color:var(--bl);box-shadow:0 0 0 3px #dc262626}label{display:block;font-size:13px;font-weight:500;margin:11px 0 4px}
.auth{max-width:440px;margin:26px auto}.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row>input,.row>select{width:auto;flex:1;min-width:120px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}@media(max-width:800px){.two{grid-template-columns:1fr}.hero{padding:42px 24px}}
.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}.line .nm{flex:1;min-width:130px;font-weight:500}
.qty{display:flex;align-items:center;gap:7px}.qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid #0a0a0a;background:#fff;color:#0a0a0a;cursor:pointer}
.tot{display:flex;justify-content:space-between;margin:7px 0}.tot.big{font-size:21px;font-weight:700;border-top:1px solid var(--ln);padding-top:9px}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;background:#ede4ff;color:var(--pu);font-weight:600}.tag.low{background:#ffe3ea;color:var(--bad)}.tag.go{background:#e9ddff;color:#5b21b6}.tag.ok{background:#d9f7ec;color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:12px 0 18px}.stat{border-left:6px solid #0a0a0a}.stat:nth-child(4n+2){border-color:var(--bl)}.stat:nth-child(4n+3){border-color:var(--pu)}.stat:nth-child(4n){border-color:var(--pk)}
.stat span{font-size:13px;color:var(--mut)}.stat b{display:block;font-size:23px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px;border-bottom:1px solid var(--ln)}th{color:var(--mut);font-weight:600}.wrap{overflow-x:auto}
.bars{display:flex;gap:10px;align-items:flex-end;height:130px;margin-top:8px}.bars div{flex:1;text-align:center;font-size:11px}.bars i{display:block;background:linear-gradient(var(--bl),#000);border-radius:8px 8px 0 0;min-height:3px}
.tile{cursor:pointer;text-align:center;padding:10px;border-radius:14px;border:1.5px solid var(--ln);background:#fff;font-family:inherit}.tile:hover{border-color:var(--pk);background:#fff5f6}.tile:disabled{opacity:.4;cursor:not-allowed}.tile b{display:block;font-size:13px}.tile .em{font-size:30px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:30}.rc{font-family:'Courier New',monospace;width:320px;max-height:92vh;overflow:auto}.rc td{border:0;padding:2px 0}.rc hr{border:0;border-top:1px dashed #888;margin:8px 0}
footer{background:#000;color:#c9c9d1;text-align:center;padding:28px 20px;font-size:14px;border-top:4px solid var(--pk)}footer b{color:#fff}footer i{color:var(--yl)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:var(--dk);color:#fff;padding:11px 22px;border-radius:99px;transition:.3s;z-index:50;font-size:14px;border:2px solid var(--yl)}#toast.show{transform:translateX(-50%)}
@media print{body>*:not(.modal){display:none!important}.modal{position:static;background:#fff}.noprint{display:none!important}.rc{width:100%;max-height:none}.card{border:0}}
</style>

const pcard=(p,i)=>`<div class="card pc t${i%4}"><div class="em">${p.em}</div><h3>${esc(p.name)}</h3><div class="cat">${esc(p.cat)}</div><div class="foot"><span class="price">${p.price>0?R(p.price):''}</span>${p.stock<1?'<span class="tag low">Sold out</span>':p.price>0?`<button class="btn sm" onclick="add(${p.id})">Add</button>`:'<span class="tag go">Ask in store</span>'}</div></div>`;
function shopGrid(){$('#chips').innerHTML=['All',...CATS.map(c=>c[0])].map(c=>`<div class="chip ${c===shopCat?'on':''}" onclick="shopCat='${c}';shopGrid()">${c}</div>`).join('');
 const q=shopQ.toLowerCase();$('#grid').innerHTML=DB.products.filter(p=>(shopCat==='All'||p.cat===shopCat)&&p.name.toLowerCase().includes(q)).map(pcard).join('')||'<p class="sub">No products found.</p>'}

// ================= TILL (staff) =================
const tillTotal=()=>Object.entries(till).reduce((s,[id,q])=>s+P(id).price*q,0);
function tAdd(id){const p=P(id);if((till[id]||0)>=p.stock)return toast('No more stock');till[id]=(till[id]||0)+1;tillCart()}
function tSet(id,q){if(q<=0)delete till[id];else till[id]=Math.min(q,P(id).stock);tillCart()}
function tillGrid(){$('#tchips').innerHTML=['All',...CATS.map(c=>c[0])].map(c=>`<div class="chip ${c===tCat?'on':''}" onclick="tCat='${c}';tillGrid()">${c}</div>`).join('');
 const q=tQ.toLowerCase();$('#tgrid').innerHTML=DB.products.filter(p=>(tCat==='All'||p.cat===tCat)&&p.name.toLowerCase().includes(q)).map(p=>`<button class="tile" ${p.stock<1||p.price<=0?'disabled':''} onclick="tAdd(${p.id})"><span class="em">${p.em}</span><b>${esc(p.name)}</b>${R(p.price)}<br><small style="color:${p.stock<=LOW?'var(--bad)':'var(--mut)'}">${p.stock} left</small></button>`).join('')}
function tillCart(){const t=tillTotal(),ids=Object.keys(till);
 $('#tcart').innerHTML=`<h3>Current sale</h3>${ids.map(id=>`<div class="line"><span class="nm">${esc(P(id).name)}<br><small>${R(P(id).price)}</small></span><span class="qty"><button onclick="tSet(${id},${till[id]-1})">−</button><b>${till[id]}</b><button onclick="tSet(${id},${till[id]+1})">+</button></span><b>${R(P(id).price*till[id])}</b></div>`).join('')||'<p class="sub">Tap products to add them.</p>'}
 <div class="tot big"><span>Total</span><span>${R(t)}</span></div>
 <label>Payment</label><select onchange="tPay=this.value;tillCart()"><option value="cash" ${tPay==='cash'?'selected':''}>Cash</option><option value="card" ${tPay==='card'?'selected':''}>Card</option><option value="eft" ${tPay==='eft'?'selected':''}>EFT</option></select>
 ${tPay==='cash'?`<label>Cash received</label><input type="number" min="0" value="${tTend}" oninput="tTend=this.value;$('#chg').textContent=R(Math.max(0,tTend-${t}))"><div class="tot"><span>Change</span><b id="chg">${R(Math.max(0,tTend-t))}</b></div>`:''}
 <div class="row"><button class="btn y" style="flex:1" onclick="completeSale()" ${ids.length?'':'disabled'}>Complete sale</button><button class="btn sm out" onclick="till={};tTend='';tillCart()">Clear</button></div>`}
const completeSale=T(()=>{const t=tillTotal();if(tPay==='cash'&&tTend!==''&&+tTend<t)throw Error('Cash received is less than the total');
 const s=makeSale({items:till,channel:'till',pay:tPay,by:me.name,tendered:tPay==='cash'&&tTend!==''?+tTend:0});till={};tTend='';tillCart();tillGrid();toast('Sale #'+s.id+' done ✅');receipt(s.id)});

// ================= STOCK / TEAM / EXPENSES =================
const stk=T((id,type)=>{const p=P(id),q=Number($('#q'+id).value);if(!Number.isInteger(q)||q<(type==='set'?0:1))throw Error('Enter a valid quantity');
 if(type==='in'){p.stock+=q;if($('#rc').checked)DB.money.push({t:Date.now(),amt:p.cost*q,note:`Stock in: ${p.name} x${q}`,by:me.name})}
 else if(type==='out'){if(q>p.stock)throw Error('Not enough stock');p.stock-=q}else{DB.moves.push({t:Date.now(),pid:id,name:p.name,type:'adjust',qty:q-p.stock,by:me.name});p.stock=q;save();return render()}
 DB.moves.push({t:Date.now(),pid:id,name:p.name,type,qty:q,by:me.name});save();render()});
const addProd=T(()=>{const g=i=>$('#'+i).value.trim();if(!g('np')||!g('npp'))throw Error('Name and price needed');const id=DB.nextP++;
 DB.products.push({id,name:g('np'),cat:g('nc')||'General',em:g('ne')||'🛍️',price:+g('npp'),cost:+g('npc')||0,stock:+g('nps')||0});save();render()});
const editP=T((id,k,v)=>{P(id)[k]=Math.max(0,+v);save()});
const delProd=id=>confirm('Delete this product?')&&(DB.products=DB.products.filter(p=>p.id!==id),save(),render());
const addExp=T(()=>{const a=+$('#ea').value;if(!(a>0))throw Error('Enter an amount');DB.money.push({t:Date.now(),amt:a,note:$('#en').value.trim()||'Expense',by:me.name});save();render()});
const addStaff=T(async()=>{const n=$('#sn').value.trim(),p=$('#sp').value;if(!n)throw Error('Name needed');if(p.length<4)throw Error('PIN needs 4+ characters');
 if(DB.staff.some(s=>s.name.toLowerCase()===n.toLowerCase()))throw Error('Name already exists');const salt=mkSalt();DB.staff.push({id:DB.nextS++,name:n,salt,hash:await hashPw(p,salt)});save();render()});
const resetPin=T(async id=>{const p=prompt('New PIN (4+ characters)');if(!p)return;if(p.length<4)throw Error('PIN too short');const s=DB.staff.find(x=>x.id===id);s.salt=mkSalt();s.hash=await hashPw(p,s.salt);save();toast('PIN changed')});
const delStaff=id=>confirm('Remove this staff member?')&&(DB.staff=DB.staff.filter(s=>s.id!==id),save(),render());
const restore=T(f=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products)throw 0;localStorage[KEY]=r.result;location.reload()}catch{toast('That file is not a valid backup')}};r.readAsText(f.files[0])});

// ================= VIEWS =================
const stat=(l,v)=>`<div class="card stat"><span>${l}</span><b>${v}</b></div>`;
const views={
home:()=>`<div class="hero"><img src="${LOGO}" class="hero-logo" alt="Afro Glow"><h1>${SLOGAN}</h1><p>Weaves, braiding hair, hair care, accessories, nails and beauty, all in one place.</p><a class="btn y" href="#shop">Shop now</a></div>
 <div class="sec"><h2>Shop by category</h2><p class="sub">Everything you need for your next look</p><div class="cats">${CATS.map(([c,e])=>`<div class="card cat-t" onclick="shopCat='${c}';location.hash='#shop'"><span>${e}</span>${c}</div>`).join('')}</div></div>
 <div class="sec"><h2>Customer favourites</h2><p class="sub">Our most loved picks</p><div class="grid">${FAV.map(n=>DB.products.find(p=>p.name===n)).filter(Boolean).map(pcard).join('')}</div></div>
 <div class="sec card" style="text-align:center;padding:32px"><h2>Join the Glow Club 💜</h2><p class="sub">Create an account to track your orders and check out faster.</p>${me&&me.type==='customer'?'<a class="btn" href="#shop">Keep shopping</a>':'<a class="btn" href="#register">Create account</a>'}</div>`,
shop:()=>`<h2 class="t">Shop</h2><input id="q" placeholder="Search products…" value="${esc(shopQ)}" oninput="shopQ=this.value;shopGrid()" style="max-width:360px;margin-top:8px"><div class="chips" id="chips"></div><div class="grid" id="grid"></div>`,
cart:()=>{const ids=Object.keys(cart);if(!ids.length)return`<div class="card" style="text-align:center;padding:48px"><div style="font-size:58px">🛍️</div><h2>Your cart is empty</h2><p class="sub">Find something you love.</p><a class="btn" href="#shop">Go shopping</a></div>`;
 const s=cartSub();return`<h2 class="t" style="margin-bottom:12px">Your cart</h2><div class="two"><div class="card">${ids.map(id=>{const p=P(id);return`<div class="line"><span style="font-size:32px">${p.em}</span><span class="nm">${esc(p.name)}<br><small>${R(p.price)} each</small></span><span class="qty"><button onclick="setQty(${id},${cart[id]-1})">−</button><b>${cart[id]}</b><button onclick="setQty(${id},${cart[id]+1})">+</button></span><b style="min-width:76px;text-align:right">${R(p.price*cart[id])}</b><button class="btn sm out" onclick="setQty(${id},0)">✕</button></div>`}).join('')}</div>
 <form class="card" onsubmit="placeOrder(event)"><h3>Checkout</h3><label>Collect or deliver?</label><select name="method" onchange="updFee(this,${DELIV},${s})"><option value="collect">Collect in store (free)</option><option value="delivery">Delivery (${R(DELIV)}, free over ${R(FREE)})</option></select>
 <div id="addrw" style="display:none"><label>Delivery address</label><textarea name="addr" rows="2"></textarea></div><div class="tot" style="margin-top:14px"><span>Subtotal</span><span>${R(s)}</span></div><div class="tot"><span>Delivery</span><span id="fee">R0.00</span></div><div class="tot big"><span>Total</span><span id="gt">${R(s)}</span></div>
 <p style="font-size:12px;color:var(--mut)">Pay on collection or delivery.</p><button class="btn y" style="width:100%">${me&&me.type==='customer'?'Place order':'Log in to order'}</button></form></div>`},
login:()=>`<form class="card auth" onsubmit="doLogin(event)"><h2>Welcome back 💜</h2><p class="sub">Log in to your Afro Glow account</p><label>Email</label><input name="email" type="email" required><label>Password</label><div style="position:relative"><input name="pw" type="password" required><button type="button" onclick="togglePw(this)" style="position:absolute;right:8px;top:6px;background:none;border:0;cursor:pointer;font-size:18px">👁</button></div>
 <button class="btn" style="width:100%;margin-top:14px">Log in</button><p style="text-align:center;margin-top:12px;font-size:14px">New here? <a href="#register" style="color:var(--pu);font-weight:600">Create an account</a></p></form>`,
register:()=>`<form class="card auth" onsubmit="doRegister(event)"><h2>Join Afro Glow ✨</h2><p class="sub">Create your account in a minute</p><label>Full name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Phone number</label><input name="phone" type="tel" required>
 <label>Password</label><div style="position:relative"><input name="pw" type="password" required><button type="button" onclick="togglePw(this)" style="position:absolute;right:8px;top:6px;background:none;border:0;cursor:pointer;font-size:18px">👁</button></div><label>Confirm password</label><input name="pw2" type="password" required>
 <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input name="terms" type="checkbox" style="width:auto"> I agree to the terms &amp; privacy policy</label><button class="btn" style="width:100%;margin-top:12px">Create account</button><p style="text-align:center;margin-top:12px;font-size:14px">Have an account? <a href="#login" style="color:var(--pu);font-weight:600">Log in</a></p></form>`,
account:()=>{const u=DB.users.find(x=>x.email===me.email),os=DB.sales.filter(s=>s.cust===me.email).reverse();
 return`<h2 class="t">My account</h2><div class="card" style="margin:12px 0"><b>${esc(u.name)}</b><br>${esc(u.email)} · ${esc(u.phone)}</div><h3>My orders</h3>${os.map(o=>`<div class="card" style="margin-top:10px"><div class="row" style="justify-content:space-between"><b>Order #${o.id}</b><span class="tag ${o.status==='collected'?'ok':o.status==='pending'?'go':'low'}">${o.status==='collected'?'Completed':o.status==='pending'?'Pending':'Cancelled'}</span></div>
 <small>${dt(o.t)} · ${o.method==='delivery'?'Delivery to '+esc(o.addr):'Collect in store'}</small><div style="margin:6px 0">${o.items.map(i=>`${esc(i.name)} × ${i.qty}`).join('<br>')}</div><b>Total ${R(o.total)}</b></div>`).join('')||'<p class="sub">No orders yet.</p>'}`},
stafflogin:()=>`<div class="auth"><div class="card"><h2>Staff login</h2>${DB.staff.length?`<form onsubmit="staffLogin(event)"><label>Your name</label><select name="sid">${DB.staff.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><label>PIN</label><input name="pin" type="password" required><button class="btn" style="width:100%;margin-top:12px">Log in</button></form>`:'<p class="sub">No staff yet. The owner adds staff under Team.</p>'}</div>
 <div class="card" style="margin-top:16px"><h2>Owner</h2>${DB.owner?`<form onsubmit="ownerLogin(event)"><label>Owner password</label><input name="pw" type="password" required><button class="btn y" style="width:100%;margin-top:12px">Owner login</button></form>`:
 `<p class="sub">First time? Set up the owner account.</p><form onsubmit="ownerSetup(event)"><label>Your name</label><input name="name" required><label>Choose a password (8+ characters)</label><input name="pw" type="password" required><button class="btn y" style="width:100%;margin-top:12px">Create owner account</button></form>`}</div></div>`,
till:()=>`<h2 class="t">Till</h2><p class="sub">Serving as ${esc(me.name)}. Tap a product to add it.</p><div class="two"><div><input placeholder="Search products…" value="${esc(tQ)}" oninput="tQ=this.value;tillGrid()"><div class="chips" id="tchips"></div><div class="grid sm" id="tgrid"></div></div><div class="card" id="tcart"></div></div>`,
orders:()=>{const os=DB.sales.filter(s=>s.status==='pending').reverse();return`<h2 class="t">Online orders</h2><p class="sub">Stock is held for pending orders. Mark collected when the customer pays, or cancel to return the stock.</p>${os.map(o=>`<div class="card" style="margin-bottom:10px"><b>Order #${o.id}</b> · ${dt(o.t)} · ${esc((DB.users.find(u=>u.email===o.cust)||{}).name||o.cust)} <small>${esc((DB.users.find(u=>u.email===o.cust)||{}).phone||'')}</small>
 <div><small>${o.method==='delivery'?'Delivery: '+esc(o.addr):'Collect in store'}</small></div><div style="margin:6px 0">${o.items.map(i=>`${esc(i.name)} × ${i.qty}`).join(', ')}</div>
 <div class="row"><b>${R(o.total)}</b><select id="pay${o.id}" style="max-width:110px"><option value="cash">Cash</option><option value="card">Card</option><option value="eft">EFT</option></select><button class="btn sm y" onclick="collect(${o.id})">Collected &amp; paid</button><button class="btn sm pk" onclick="cancelOrder(${o.id})">Cancel</button></div></div>`).join('')||'<p class="card sub">No pending orders 🎉</p>'}`},
stock:()=>`<h2 class="t">Stock</h2><label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="rc" checked style="width:auto"> When receiving stock, record the cost as money out</label>
 <div class="card wrap" style="margin-top:10px"><table><tr><th>Item</th><th>In stock</th><th>Qty</th><th></th>${isOwner()?'<th>Price</th><th>Cost</th><th></th>':''}</tr>${DB.products.map(p=>`<tr><td>${p.em} ${esc(p.name)}</td><td><span class="tag ${p.stock<=LOW?'low':''}">${p.stock}</span></td><td><input id="q${p.id}" type="number" min="0" style="width:72px"></td>
 <td style="white-space:nowrap"><button class="btn sm" onclick="stk(${p.id},'in')">Receive</button> <button class="btn sm pk" onclick="stk(${p.id},'out')">Write-off</button> <button class="btn sm y" onclick="stk(${p.id},'set')">Set count</button></td>
 ${isOwner()?`<td><input type="number" value="${p.price}" style="width:80px" onchange="editP(${p.id},'price',this.value)"></td><td><input type="number" value="${p.cost}" style="width:80px" onchange="editP(${p.id},'cost',this.value)"></td><td><button class="btn sm out" onclick="delProd(${p.id})">✕</button></td>`:''}</tr>`).join('')}</table></div>
 ${isOwner()?`<div class="card" style="margin-top:14px"><h3>Add product</h3><div class="row"><input id="np" placeholder="Name"><input id="nc" placeholder="Category" list="cl"><datalist id="cl">${CATS.map(c=>`<option>${c[0]}</option>`).join('')}</datalist><input id="ne" placeholder="Emoji" style="max-width:80px"><input id="npp" type="number" placeholder="Price"><input id="npc" type="number" placeholder="Cost"><input id="nps" type="number" placeholder="Stock"><button class="btn sm" onclick="addProd()">Add</button></div></div>`:''}`,
dash:()=>{const own=isOwner(),who=own?null:me.name;if(!own)repDay=today();const r=rep(repDay,who),low=DB.products.filter(p=>p.stock<=LOW);
 const week=[...Array(7)].map((_,i)=>{const d=day(Date.now()-(6-i)*864e5);return[d.slice(5),rep(d).total]}),mx=Math.max(1,...week.map(w=>w[1]));
 return`<h2 class="t">${own?'Business dashboard':'My day'}</h2>${own?`<div class="row"><b>Date:</b><input type="date" value="${repDay}" onchange="repDay=this.value;render()" style="max-width:180px"></div>`:`<p class="sub">${esc(me.name)} · ${repDay}</p>`}
 <div class="stats">${stat('Total sales',R(r.total))}${stat('Number of sales',r.count)}${stat('Units sold',r.units)}${stat('Cash',R(r.pay.cash))}${stat('Card',R(r.pay.card))}${stat('EFT',R(r.pay.eft))}${own?stat('Expenses (money out)',R(r.exp))+stat('Net cash',R(r.net))+stat('Gross profit',R(r.profit)):''}${stat('Stock in / out',r.inn+' / '+r.out)}${stat('Pending orders',pending())}</div>
 <div class="row"><button class="btn y" onclick="waReport()">📲 Send report on WhatsApp</button><button class="btn sm out" onclick="csv()">⬇ Sales CSV</button></div>
 ${own?`<div class="two" style="margin-top:14px"><div class="card"><h3>Last 7 days</h3><div class="bars">${week.map(([d,t])=>`<div><small>${t?'R'+Math.round(t):''}</small><i style="height:${Math.round(t/mx*100)}px"></i>${d}</div>`).join('')}</div></div>
 <div class="card"><h3>Sales by staff</h3><table>${Object.entries(r.by).map(([n,v])=>`<tr><td>${esc(n)}</td><td>${v.n} sales</td><td>${R(v.t)}</td></tr>`).join('')||'<tr><td class="sub">No sales</td></tr>'}</table></div></div>`:''}
 <div class="card" style="margin-top:14px"><h3>Sales</h3><div class="wrap"><table><tr><th>#</th><th>Time</th><th>Staff</th><th>Pay</th><th>Total</th><th></th></tr>${r.S.slice().reverse().map(s=>`<tr><td>${s.id}</td><td>${tm(s.paidAt)}</td><td>${esc(s.by)}</td><td>${s.pay}</td><td>${R(s.total)}</td><td><button class="btn sm out" onclick="receipt(${s.id})">Receipt</button></td></tr>`).join('')||'<tr><td colspan="6" class="sub">No sales yet</td></tr>'}</table></div></div>
 ${low.length?`<div class="card" style="margin-top:14px"><h3>⚠ Low stock</h3>${low.map(p=>`${esc(p.name)}: <b>${p.stock}</b>`).join(' · ')}</div>`:''}
 ${own?`<div class="card" style="margin-top:14px"><h3>Money out</h3><div class="row"><input id="ea" type="number" placeholder="Amount (R)"><input id="en" placeholder="What for? (rent, transport…)"><button class="btn sm" onclick="addExp()">Save expense</button></div>
 <table>${r.ex.map(m=>`<tr><td>${tm(m.t)}</td><td>${esc(m.note)}</td><td>${R(m.amt)}</td><td>${esc(m.by)}</td></tr>`).join('')}</table></div>
 <div class="card" style="margin-top:14px"><h3>Settings &amp; backup</h3><div class="row"><input placeholder="Owner WhatsApp (e.g. 27821234567)" value="${esc(DB.wa)}" onchange="DB.wa=this.value;save();toast('Saved')"></div>
 <div class="row"><button class="btn sm out" onclick="dl('afroglow-backup-'+today()+'.json',JSON.stringify(DB),'application/json')">⬇ Download backup</button><label class="btn sm out" style="margin:0">⬆ Restore backup<input type="file" accept=".json" hidden onchange="restore(this)"></label></div></div>`:''}`},
team:()=>`<h2 class="t">Team</h2><p class="sub">Each person logs in with their own name and PIN, so every sale is tracked to them.</p><div class="card"><div class="row"><input id="sn" placeholder="Name"><input id="sp" type="password" placeholder="PIN (4+ characters)"><button class="btn sm" onclick="addStaff()">Add staff</button></div>
 <table>${DB.staff.map(s=>`<tr><td>${esc(s.name)}</td><td>${rep(today(),s.name).count} sales today</td><td><button class="btn sm out" onclick="resetPin(${s.id})">Reset PIN</button> <button class="btn sm pk" onclick="delStaff(${s.id})">Remove</button></td></tr>`).join('')||'<tr><td class="sub">No staff yet</td></tr>'}</table></div>`};

// ================= ROUTER =================
function header(){const cur=(location.hash.slice(1)||'home').split('?')[0],a=(h,l)=>`<a href="#${h}" class="${cur===h?'on':''}">${l}</a>`;
 let h=`<a href="#home" class="logo brand"><img src="${LOGO}" alt="Afro Glow logo"><span>Afro<i>Glow</i><small>${SLOGAN}</small></span></a>`+a('home','Home')+a('shop','Shop');
 if(isStaff()){const n=pending();h+=a('till','🧾 Till')+a('orders','Orders'+(n?`<span class="cnt">${n}</span>`:''))+a('stock','Stock')+a('dash',isOwner()?'Dashboard':'My day')+(isOwner()?a('team','Team'):'')+`<button onclick="logout()">Logout (${esc(me.name)})</button>`}
 else{h+=a('cart','🛍️ Cart'+(cartCount()?`<span class="cnt">${cartCount()}</span>`:''))+(me?a('account','Hi, '+esc(me.name.split(' ')[0]))+`<button onclick="logout()">Logout</button>`:a('login','Login')+`<a href="#register" class="reg">Register</a>`)+a('stafflogin','Staff')}
 $('#nav').innerHTML=h}
const STAFF_PAGES=['till','orders','stock','dash'];
function route(){let r=(location.hash.slice(1)||'home').split('?')[0];if(!views[r])r='home';
 if(STAFF_PAGES.includes(r)&&!isStaff())return location.hash='#stafflogin';
 if(r==='team'&&!isOwner())return location.hash='#stafflogin';
 if(r==='account'&&(!me||me.type!=='customer'))return need('#account');
 if((r==='login'||r==='register')&&me)return location.hash=isStaff()?'#till':'#home';
 if(r==='stafflogin'&&isStaff())return location.hash=isOwner()?'#dash':'#till';
 $('#view').innerHTML=views[r]();header();if(r==='shop')shopGrid();if(r==='till'){tillGrid();tillCart()}window.scrollTo(0,0)}
const render=()=>{const y=scrollY;route();scrollTo(0,y)};
window.addEventListener('hashchange',route);$('#yr').textContent=new Date().getFullYear();route();
</script>
</body>
</html>
