<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up | Afro Glow</title>
<link rel="icon" href="images/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="signup">
<!-- Header and navigation are built by js/app.js so every page shares them -->
<header id="site-header"></header>
<main id="page">
<form class="card auth" onsubmit="doSignup(event)">
  <h2 id="su-title">Join Afro Glow ✨</h2>
  <p class="sub" id="su-sub">Create your account in a minute and start earning loyalty points.</p>
  <label>Full name</label><input name="name" required>
  <label>Email</label><input name="email" type="email" required>
  <label>Phone number</label><input name="phone" type="tel" required>
  <label>Password (8+ characters, letters and a number)</label><div style="position:relative"><input name="pw" type="password" required><button type="button" onclick="togglePw(this)" style="position:absolute;right:8px;top:6px;background:none;border:0;cursor:pointer;font-size:18px">👁</button></div>
  <label>Confirm password</label><input name="pw2" type="password" required>
  <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input name="terms" type="checkbox" style="width:auto"> I agree to the terms &amp; privacy policy</label>
  <button class="btn" style="width:100%;margin-top:12px">Create account</button>
  <p style="text-align:center;margin-top:12px;font-size:14px">Already have an account? <a href="login.html" style="color:var(--bl);font-weight:600">Log in</a></p>
</form>
</main>
<footer id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
